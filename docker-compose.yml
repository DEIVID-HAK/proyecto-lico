version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - PYTHONPATH=/app
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      # Mount the frontend directory for Hot Module Replacement (HMR)
      - ./frontend:/app
      - /app/node_modules
    environment:
      # Vite uses this to know where the backend is
      - VITE_API_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped
